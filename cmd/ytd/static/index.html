<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube DownloadR</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1 id="title">YouTube DownloadR</h1>
      <p class="sub">YouTube videó / hang letöltése · yt-dlp + ffmpeg</p>
    </header>

    <div class="bitrate-row" id="cookiesRow">
      <span>YouTube fiók</span>
      <button id="login" type="button">Bejelentkezés</button>
      <button id="loginDone" type="button" hidden>Belépés kész</button>
    </div>

    <div class="field">
      <span>YouTube URL</span>
      <div class="url-row">
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" />
        <button id="pasteUrl" type="button" class="icon-btn" title="Beillesztés a vágólapról" aria-label="Beillesztés a vágólapról">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M16 4h-1.5c-.3-1.2-1.4-2-2.5-2s-2.2.8-2.5 2H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-4-1c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm4 17H8V6h1.2c.3.9 1.2 1.5 2.3 1.5s2-.6 2.3-1.5H16v14z"/>
          </svg>
        </button>
      </div>
      <p id="qualityHint" class="hint" hidden></p>
    </div>

    <div class="format-row">
      <img id="cover" class="cover" alt="A klip borítóképe" hidden />
      <section class="card">
      <div class="label">Formátum</div>
      <div class="formats">
        <label><input type="radio" name="format" value="mp3" checked /> MP3</label>
        <label><input type="radio" name="format" value="mp4" /> MP4</label>
        <label><input type="radio" name="format" value="wav" /> WAV</label>
      </div>
      <label class="bitrate-row" id="bitrateRow">
        <span>MP3 bitráta</span>
        <select id="bitrate">
          <option value="128">128</option>
          <option value="256">256</option>
          <option value="320" selected>320</option>
        </select>
        <span class="unit">kbps</span>
      </label>
      <label class="bitrate-row disabled" id="resolutionRow">
        <span>MP4 felbontás</span>
        <select id="resolution" disabled>
          <option value="720">720p</option>
          <option value="1080" selected>1080p</option>
          <option value="1440">2K (1440p)</option>
          <option value="2160">4K (2160p)</option>
        </select>
      </label>
      </section>
    </div>

    <div class="field">
      <span>Mentési mappa</span>
      <div class="dest-row">
        <input id="dest" type="text" placeholder="Pl. D:\YouTube_downloads" />
        <button id="browse" type="button">Tallózás…</button>
      </div>
    </div>
    <p class="hint">Egyetlen videó közvetlenül ide mentődik. Playlist esetén (<code>list=</code> a linkben) videónként külön alkönyvtár készül.</p>

    <div class="actions">
      <button id="download" class="primary" type="button">Letöltés</button>
      <button id="cancel" type="button" disabled>Megszakítás</button>
      <button id="update" type="button">yt-dlp frissítés</button>
      <button id="quit" type="button" class="danger right">Kilépés</button>
    </div>

    <section class="dl-strip" id="dlStrip" aria-label="Letöltés állapota">
      <div class="dl-main">
        <div class="dl-top">
          <span class="dl-label">Letöltés</span>
          <span id="dlState" class="dl-state">Készen áll</span>
        </div>
        <div class="dl-track" id="dlTrack">
          <div class="dl-fill" id="dlFill"></div>
        </div>
        <p id="dlPath" class="dl-path" title="">—</p>
      </div>
      <button id="openFolder" type="button" class="dl-open" disabled title="Letöltési mappa megnyitása">
        Mappa megnyitás
      </button>
    </section>

    <pre id="log" class="log"></pre>
    <p id="tools" class="tools"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
